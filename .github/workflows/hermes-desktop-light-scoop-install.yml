name: Hermes Desktop Light public Scoop install

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Hermes Desktop Light]
    types: [completed]
  pull_request:
    paths:
      - .github/workflows/hermes-desktop-light-scoop-install.yml
      - scripts/verify-scoop-install.ps1
      - scripts/accept-hermes-desktop-light.cjs
      - scripts/hermes-desktop-light.py
      - scripts/distribution.py

permissions:
  contents: read

jobs:
  resolve-published:
    name: Resolve published bucket commit
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      apps: ${{ steps.resolve.outputs.apps }}
    steps:
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          # Follow the bucket users actually install: the exact publisher
          # writeback after a release, otherwise the current public main.
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            # The release train uploads one written-back artifact per channel.
            match="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${WORKFLOW_RUN_ID}/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.expired == false and (.name == "hermes-desktop-light-stable-written-back-sha" or .name == "hermes-desktop-light-canary-written-back-sha"))] | (.[0] // {}) | [.id // "", .name // ""] | @tsv')"
            artifact_id="${match%%$'\t'*}"
            artifact_name="${match#*$'\t'}"
            if [[ -z "$artifact_id" ]]; then
              echo "The triggering run published nothing; no new public state to verify."
              exit 0
            fi
            scratch="$(mktemp -d)"
            gh run download "$WORKFLOW_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "$artifact_name" --dir "$scratch"
            target="$(tr -d '\r\n' < "$scratch/written-back-sha.txt")"
          else
            target="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" refs/heads/main | cut -f1)"
          fi
          if [[ ! "$target" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Resolved bucket commit is not an exact lowercase 40-character SHA" >&2
            exit 1
          fi
          echo "sha=$target" >> "$GITHUB_OUTPUT"

          # Verify every Light package that the resolved bucket commit publishes.
          apps=""
          for app in hermes-desktop-light hermes-desktop-light-canary; do
            if gh api "repos/${GITHUB_REPOSITORY}/contents/bucket/${app}.json?ref=${target}" >/dev/null 2>&1; then
              apps="${apps}\"${app}\","
            fi
          done
          apps="[${apps%,}]"
          if [[ "$apps" == "[]" ]]; then
            echo "Bucket commit ${target} publishes no Light package" >&2
            exit 1
          fi
          if ! printf '%s' "$apps" | python3 -c 'import json,sys; json.load(sys.stdin)'; then
            echo "Published package list is not valid JSON: $apps" >&2
            exit 1
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "Published Light packages at ${target}: ${apps}"

  verify-public-scoop-install:
    needs: resolve-published
    # This job verifies what is published on main, so it runs after a publish or
    # on demand.  On a pull request the published manifest is still the previous
    # layout and its package identity legitimately differs from the PR.
    if: needs.resolve-published.outputs.sha != '' && github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.resolve-published.outputs.apps) }}
    name: verify public Scoop install (${{ matrix.app }})
    steps:
      - name: Check out bucket verifier
        uses: actions/checkout@v4
        with:
          path: bucket
          persist-credentials: false

      - name: Check out the published bucket state
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-published.outputs.sha }}
          path: published
          persist-credentials: false

      - name: Set up Python for the upstream gateway
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Derive expectations from the published manifest and release pointer
        id: published
        shell: pwsh
        run: python bucket/scripts/hermes-desktop-light.py published-expectations --bucket-root published --app ${{ matrix.app }}

      - name: Check out the published upstream commit for the gateway
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ steps.published.outputs.upstream_commit }}
          path: upstream
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      # 上流の uv.lock をそのまま再現する。pip で毎回解決すると
      # browser-harness==0.1.13 の pillow==12.3.0 と hermes-agent の
      # Pillow==13.0.0 が衝突して ResolutionImpossible になる。
      - name: Install the exact-release Hermes gateway (official uv lock)
        shell: pwsh
        working-directory: upstream
        run: |
          uv sync --frozen --extra web --python 3.14
          "$PWD\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "VIRTUAL_ENV=$PWD\.venv" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install Scoop (non-admin)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scoopRoot = Join-Path $env:USERPROFILE 'scoop'
          $env:PATH = "$(Join-Path $scoopRoot 'shims');$env:PATH"
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
            Invoke-RestMethod -Uri 'https://get.scoop.sh' | Invoke-Expression
          }
          $env:PATH = "$(Join-Path $scoopRoot 'shims');$env:PATH"
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            throw 'The official non-admin Scoop installer did not provide scoop.exe'
          }
          scoop --version
          scoop config cache true

      - name: Install and exercise the published bucket app
        shell: pwsh
        env:
          # Update-following: expectations are derived from the same bucket
          # commit Scoop is pinned to, so a normal publish needs no edit here.
          BUCKET_COMMIT: ${{ needs.resolve-published.outputs.sha }}
          EXPECTED_VERSION: ${{ steps.published.outputs.version }}
          EXPECTED_COMMIT: ${{ steps.published.outputs.upstream_commit }}
          EXPECTED_HASH: ${{ steps.published.outputs.sha256 }}
          EXPECTED_URL: ${{ steps.published.outputs.url }}
          APP_NAME: ${{ matrix.app }}
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE 'scoop-install-evidence'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          & "$env:GITHUB_WORKSPACE/bucket/scripts/verify-scoop-install.ps1" `
            -BucketRoot "$env:GITHUB_WORKSPACE/bucket" `
            -UpstreamDirectory "$env:GITHUB_WORKSPACE/upstream" `
            -OutputDirectory $output `
            -BucketCommit $env:BUCKET_COMMIT `
            -ExpectedVersion $env:EXPECTED_VERSION `
            -ExpectedCommit $env:EXPECTED_COMMIT `
            -ExpectedHash $env:EXPECTED_HASH `
            -ExpectedUrl $env:EXPECTED_URL `
            -AppName $env:APP_NAME

      - name: Upload small install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-desktop-light-scoop-install-evidence-${{ matrix.app }}
          path: scoop-install-evidence/*
          if-no-files-found: warn
          retention-days: 14

  regression-historical-update:
    needs: resolve-published
    # Pinned pair from retained publications: the pre-split history is shared by
    # both packages, so this runs once instead of once per published package.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Install Scoop (non-admin)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scoopRoot = Join-Path $env:USERPROFILE 'scoop'
          $env:PATH = "$(Join-Path $scoopRoot 'shims');$env:PATH"
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
            Invoke-RestMethod -Uri 'https://get.scoop.sh' | Invoke-Expression
          }
          $env:PATH = "$(Join-Path $scoopRoot 'shims');$env:PATH"
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            throw 'The official non-admin Scoop installer did not provide scoop.exe'
          }
          scoop --version
          scoop config cache true
      - name: Regression - historical published Scoop update
        shell: pwsh
        env:
          # Fixed regression pair from retained desktop-release publications.
          # Normal publishes do not move these pins. If either Release is
          # intentionally retired, replace the pair with retained publications;
          # a missing asset must fail rather than silently skip the update test.
          # Values match each pinned manifest and desktop-release pointer.
          HISTORICAL_BUCKET_COMMIT: daf867860d79f73b9dc6c3088c6b03809c27b54e
          HISTORICAL_VERSION: 26.1010.7.26-alpha.dev.1-r1
          HISTORICAL_COMMIT: dce1e9b37581dd62e480a9064dc04a709c2940d3
          HISTORICAL_HASH: dff7b40c58abf0effa1f0a4110c11683e934f699ae282cd8c38bac863888276f
          HISTORICAL_URL: https://github.com/takano536/scoop-bucket/releases/download/hermes-desktop-light%2Fv26.1010.7.26-alpha.dev.1-r1/hermes-desktop-light-26.1010.7.26-alpha.dev.1-r1-windows-x64.zip
          WRITEBACK_BUCKET_COMMIT: dd55951e75a3cf962a81c62a93c3a91fbd32e37c
          WRITEBACK_VERSION: 26.1011.7.142-alpha.dev.1-r1
          WRITEBACK_HASH: 46ea1c97e436821f925d6b50c3ef0dbf6dfd9de9e2627a9378b049310aba063d
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'hermes-desktop-light'
          $alias = 'takano536-history-verify'
          $output = Join-Path $env:GITHUB_WORKSPACE 'scoop-install-evidence'
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          $scoopRoot = Join-Path $env:USERPROFILE 'scoop'
          $historyRoot = Join-Path $env:GITHUB_WORKSPACE 'scoop-history'
          if (Test-Path -LiteralPath $historyRoot) { Remove-Item -LiteralPath $historyRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path @(
            (Join-Path $historyRoot 'shims'),
            (Join-Path $historyRoot 'buckets'),
            (Join-Path $historyRoot 'apps'),
            (Join-Path $historyRoot 'cache'),
            (Join-Path $historyRoot 'persist')
          ) | Out-Null
          $scoopCommand = Join-Path $scoopRoot 'apps\scoop\current\bin\scoop.ps1'
          if (!(Test-Path -LiteralPath $scoopCommand)) {
            $scoopCommand = Join-Path $scoopRoot 'shims\scoop.ps1'
          }
          $originalScoop = $env:SCOOP
          $env:SCOOP = $historyRoot
          function Invoke-CapturedScoop {
            param([string]$Name, [string[]]$Arguments)
            $values = @(& $scoopCommand @Arguments 2>&1 | ForEach-Object { [string]$_ })
            $exitCode = $LASTEXITCODE
            $text = $values -join "`n"
            Set-Content -LiteralPath (Join-Path $output "$Name.log") -Value $text -Encoding utf8NoBOM
            if ($exitCode -ne 0) { throw "scoop $($Arguments -join ' ') failed with exit code $exitCode" }
            return $text
          }

          function Checkout-PinnedBucket {
            param([string]$Path, [string]$Commit)
            & git -C $Path fetch --no-tags origin $Commit
            if ($LASTEXITCODE -ne 0) { throw "fetch failed for bucket commit $Commit" }
            & git -C $Path checkout --detach $Commit
            if ($LASTEXITCODE -ne 0) { throw "checkout failed for bucket commit $Commit" }
            $actual = (& git -C $Path rev-parse HEAD).Trim()
            if ($actual -ne $Commit) { throw "bucket resolved to $actual, expected $Commit" }
            Write-Output "Bucket checkout pinned to $actual"
          }
          function Resolve-LinkTarget {
            param([string]$Path)
            $item = Get-Item -LiteralPath $Path -Force
            $target = [string]$item.Target
            if ([string]::IsNullOrWhiteSpace($target)) { return $item.FullName }
            if (![IO.Path]::IsPathRooted($target)) { $target = Join-Path $item.DirectoryName $target }
            return (Get-Item -LiteralPath $target -Force).FullName
          }

          try {
            $historicalResponse = Invoke-WebRequest -UseBasicParsing -Method Head -Uri $env:HISTORICAL_URL -TimeoutSec 120
            if ($historicalResponse.StatusCode -lt 200 -or $historicalResponse.StatusCode -ge 400) {
              throw "Historical Release URL returned HTTP $($historicalResponse.StatusCode)"
            }
            Write-Output "Historical Release URL reachable: $env:HISTORICAL_URL (HTTP $($historicalResponse.StatusCode))"
            Invoke-CapturedScoop -Name 'scoop-history-bucket-add' -Arguments @(
              'bucket', 'add', $alias, 'https://github.com/takano536/scoop-bucket'
            ) | Out-Null
            $bucketPath = Join-Path $historyRoot "buckets\$alias"
            Checkout-PinnedBucket -Path $bucketPath -Commit $env:HISTORICAL_BUCKET_COMMIT
            $manifest = Get-Content -LiteralPath (Join-Path $bucketPath "bucket\$app.json") -Raw | ConvertFrom-Json
            $pointer = Get-Content -LiteralPath (Join-Path $bucketPath 'metadata/hermes-desktop-light-release.json') -Raw | ConvertFrom-Json
            $manifestUrl = [string]$manifest.architecture.'64bit'.url
            $manifestHash = [string]$manifest.architecture.'64bit'.hash
            if (
              [string]$manifest.version -ne $env:HISTORICAL_VERSION -or
              $manifestUrl -ne $env:HISTORICAL_URL -or
              $manifestHash -ne $env:HISTORICAL_HASH -or
              [string]$pointer.commit -ne $env:HISTORICAL_COMMIT -or
              [string]$pointer.version -ne $env:HISTORICAL_VERSION -or
              [string]$pointer.sha256 -ne $env:HISTORICAL_HASH
            ) { throw 'Historical bucket manifest did not match pinned Release values' }

            $oldInstall = Invoke-CapturedScoop -Name 'scoop-history-install' -Arguments @('install', "$alias/$app")
            Write-Output $oldInstall
            $oldCache = @(Get-ChildItem -LiteralPath (Join-Path $historyRoot 'cache') -File |
              Where-Object { $_.Name -like "$app*" } | Sort-Object LastWriteTimeUtc -Descending)
            if ($oldCache.Count -eq 0) { throw 'Historical Scoop cache has no archive' }
            $oldCacheHash = (Get-FileHash -LiteralPath $oldCache[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($oldCacheHash -ne $env:HISTORICAL_HASH) { throw "Historical cache hash was $oldCacheHash" }
            $oldCurrent = Join-Path $historyRoot "apps\$app\current"
            $oldVersion = Split-Path -Leaf (Resolve-LinkTarget -Path $oldCurrent)
            if ($oldVersion -ne $env:HISTORICAL_VERSION) { throw "Historical install version was $oldVersion" }
            Write-Output "Historical install version: $oldVersion; hash check: OK"

            Checkout-PinnedBucket -Path $bucketPath -Commit $env:WRITEBACK_BUCKET_COMMIT
            $update = Invoke-CapturedScoop -Name 'scoop-history-update' -Arguments @('update', $app)
            Write-Output $update
            $newCache = @(Get-ChildItem -LiteralPath (Join-Path $historyRoot 'cache') -File |
              Where-Object { $_.Name -like "$app*" } | Sort-Object LastWriteTimeUtc -Descending)
            if ($newCache.Count -eq 0) { throw 'Updated Scoop cache has no archive' }
            $newCacheHash = (Get-FileHash -LiteralPath $newCache[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($newCacheHash -ne $env:WRITEBACK_HASH) { throw "Updated cache hash was $newCacheHash" }
            $newCurrent = Join-Path $historyRoot "apps\$app\current"
            $newVersion = Split-Path -Leaf (Resolve-LinkTarget -Path $newCurrent)
            if ($newVersion -ne $env:WRITEBACK_VERSION -or $newVersion -eq $oldVersion) {
              throw "Scoop update version was $newVersion, expected $env:WRITEBACK_VERSION"
            }
            Write-Output "Scoop update: $oldVersion -> $newVersion; hash check: OK"
            [ordered]@{
              historicalBucketCommit = $env:HISTORICAL_BUCKET_COMMIT
              historicalSourceCommit = $env:HISTORICAL_COMMIT
              writebackBucketCommit = $env:WRITEBACK_BUCKET_COMMIT
              historicalVersion = $oldVersion
              historicalHash = $oldCacheHash
              updatedVersion = $newVersion
              updatedHash = $newCacheHash
            } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $output 'scoop-update-evidence.json') -Encoding utf8NoBOM
          } finally {
            if (Test-Path -LiteralPath $historyRoot) {
              try { & $scoopCommand uninstall $app 2>&1 | Out-Null } catch {}
            }
            if ($null -eq $originalScoop) { Remove-Item Env:SCOOP -ErrorAction SilentlyContinue } else { $env:SCOOP = $originalScoop }
            if (Test-Path -LiteralPath $historyRoot) {
              Remove-Item -LiteralPath $historyRoot -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload small install evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-desktop-light-scoop-update-evidence
          path: scoop-install-evidence/*
          if-no-files-found: warn
