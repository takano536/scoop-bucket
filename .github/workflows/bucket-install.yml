name: Bucket install

# 変更されたmanifestを実際にScoopでinstallし、配布物を取得できるか確認する。
# Pull Requestとmainへのpushでは、その変更で追加・更新されたアプリだけを対象にする。
# 削除だけの変更はinstallする対象がないため、削除されたアプリ名をジョブサマリに残す。
# 手動実行ではscopeでchanged/allを選べる。read-onlyで、manifestは変更しない。

on:
  pull_request:
    paths:
      - 'bucket/**'
      - 'scripts/verify-bucket-install.ps1'
      - '.github/workflows/bucket-install.yml'
  push:
    branches:
      - 'main'
      - 'master'
    paths:
      - 'bucket/**'
  workflow_dispatch:
    inputs:
      scope:
        description: 'changed: 直前の変更だけ / all: bucket/ 全体'
        type: choice
        options:
          - changed
          - all
        default: all

permissions:
  contents: read

concurrency:
  group: bucket-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    name: Install manifests
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: my_bucket
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve manifests to verify
        id: targets
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          DISPATCH_SCOPE: ${{ inputs.scope }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location ./my_bucket
          $all = $false
          $diffArguments = $null
          switch ($env:EVENT_NAME) {
            'pull_request' {
              $base = $env:PR_BASE_SHA
              if ([string]::IsNullOrWhiteSpace($base)) { throw 'The pull request base commit is unknown.' }
              & git fetch --no-tags --quiet origin $base
              if ($LASTEXITCODE -ne 0) { throw "git fetch failed for $base" }
              $diffArguments = @('diff', '--name-status', $base, 'HEAD', '--', 'bucket/')
            }
            'push' {
              $before = $env:PUSH_BEFORE_SHA
              if ([string]::IsNullOrWhiteSpace($before) -or $before -match '^0+$') {
                $all = $true
              }
              else {
                & git fetch --no-tags --quiet origin $before
                if ($LASTEXITCODE -ne 0) { throw "git fetch failed for $before" }
                $diffArguments = @('diff', '--name-status', $before, 'HEAD', '--', 'bucket/')
              }
            }
            default {
              if ($env:DISPATCH_SCOPE -eq 'all') { $all = $true }
              else { $diffArguments = @('diff', '--name-status', 'HEAD~1', 'HEAD', '--', 'bucket/') }
            }
          }
          $install = New-Object System.Collections.Generic.List[string]
          $removed = New-Object System.Collections.Generic.List[string]
          if (-not $all) {
            $lines = @(& git @diffArguments)
            if ($LASTEXITCODE -ne 0) { throw "git $($diffArguments -join ' ') failed" }
            foreach ($line in $lines) {
              if ([string]::IsNullOrWhiteSpace($line)) { continue }
              $fields = $line -split "`t"
              $status = $fields[0]
              $path = if ($status -like 'R*') { $fields[2] } else { $fields[1] }
              if ($path -notlike 'bucket/*.json') { continue }
              $name = [IO.Path]::GetFileNameWithoutExtension($path)
              if ($status -like 'D*') { $removed.Add($name) } else { $install.Add($name) }
            }
          }
          $targets = @($install | Sort-Object -Unique)
          $removedNames = @($removed | Sort-Object -Unique)
          "all=$($all.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          "apps=$($targets -join ',')" >> $env:GITHUB_OUTPUT
          "removed=$($removedNames -join ',')" >> $env:GITHUB_OUTPUT
          if ($all) { Write-Host 'Verifying every manifest in bucket/.' }
          elseif ($targets.Count -eq 0) { Write-Host 'No added or modified manifest to install.' }
          else { Write-Host "Verifying: $($targets -join ', ')" }
          if ($removedNames.Count -gt 0) {
            Write-Host "Removed (no install): $($removedNames -join ', ')"
          }

      - name: Install Scoop (non-admin)
        if: steps.targets.outputs.all == 'true' || steps.targets.outputs.apps != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $scoopRoot = Join-Path $env:USERPROFILE 'scoop'
          $shims = Join-Path $scoopRoot 'shims'
          $env:PATH = "$shims;$env:PATH"
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser -Force
            Invoke-RestMethod -Uri 'https://get.scoop.sh' | Invoke-Expression
          }
          $env:PATH = "$shims;$env:PATH"
          if (-not (Get-Command scoop -ErrorAction SilentlyContinue)) {
            throw 'The official non-admin Scoop installer did not provide scoop.exe'
          }
          $shims | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          scoop --version
          scoop config cache true

      - name: Install manifests
        if: steps.targets.outputs.all == 'true' || steps.targets.outputs.apps != ''
        shell: pwsh
        env:
          VERIFY_ALL: ${{ steps.targets.outputs.all }}
          VERIFY_APPS: ${{ steps.targets.outputs.apps }}
        run: |
          $ErrorActionPreference = 'Stop'
          $shims = Join-Path (Join-Path $env:USERPROFILE 'scoop') 'shims'
          $env:PATH = "$shims;$env:PATH"
          $output = Join-Path $env:GITHUB_WORKSPACE 'artifacts/bucket-install'
          $arguments = @{ BucketRoot = './my_bucket'; OutputDirectory = $output }
          if ($env:VERIFY_ALL -ne 'true') {
            $arguments['App'] = $env:VERIFY_APPS -split ','
          }
          ./my_bucket/scripts/verify-bucket-install.ps1 @arguments

      - name: Publish summary
        if: always()
        shell: pwsh
        env:
          VERIFY_ALL: ${{ steps.targets.outputs.all }}
          VERIFY_APPS: ${{ steps.targets.outputs.apps }}
          REMOVED_APPS: ${{ steps.targets.outputs.removed }}
        run: |
          $ErrorActionPreference = 'Stop'
          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add('### bucket install verification')
          $lines.Add('')
          if ($env:VERIFY_ALL -eq 'true') {
            $lines.Add('対象: `bucket/` 全体')
          }
          elseif ($env:VERIFY_APPS) {
            $lines.Add("対象: $($env:VERIFY_APPS -replace ',', ', ')")
          }
          else {
            $lines.Add('対象: 追加・更新されたmanifestなし')
          }
          if ($env:REMOVED_APPS) {
            $lines.Add("削除（install対象外）: $($env:REMOVED_APPS -replace ',', ', ')")
          }
          $summary = Join-Path $env:GITHUB_WORKSPACE 'artifacts/bucket-install/summary.md'
          if (Test-Path -LiteralPath $summary) {
            $lines.Add('')
            $lines.Add((Get-Content -LiteralPath $summary -Raw))
          }
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ($lines -join "`n") -Encoding utf8

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bucket-install-evidence
          path: artifacts/bucket-install
          if-no-files-found: warn
