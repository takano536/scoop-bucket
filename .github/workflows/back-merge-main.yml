name: Back merge main into dev

# main へ直接入った bot の更新（Excavator・README・release writeback）を dev に取り込む。
# GITHUB_TOKEN による push は push イベントを発生させないため、workflow_run でも起動する。
# dev が main をすでに含んでいる場合は何もしない。

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Excavator, README, Hermes Desktop Light]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: back-merge-main-into-dev
  cancel-in-progress: false

jobs:
  merge:
    name: Merge main into dev
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
          fetch-depth: 0
      - name: Merge origin/main when dev is behind
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main dev
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/dev)" ]; then
            echo '::error::dev が実行中に更新されました。再実行してください。'
            exit 1
          fi
          if git merge-base --is-ancestor origin/main HEAD; then
            echo 'dev already contains main'
            exit 0
          fi
          if ! git merge --no-edit -m 'chore: merge main into dev' origin/main; then
            git merge --abort || true
            echo '::error::main と dev が競合しました。手元で解消してください。'
            exit 1
          fi
          git push origin HEAD:dev
