name: Main source guard

# main へマージできるのは dev だけ、というルールの可視化。
# 注意: PR を GITHUB_TOKEN で作成すると workflow が起動しないため、
# dev→main の自動下書きPRではこのチェックは走らない。よって必須チェックには指定できない。

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-branch:
    name: Source branch is dev
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject merges from any branch other than dev
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::main へマージできるのはこのリポジトリの dev だけです（fork: $HEAD_REPO）"
            exit 1
          fi
          if [ "$HEAD_REF" != "dev" ]; then
            echo "::error::main へマージできるのは dev だけです（head: $HEAD_REF）"
            exit 1
          fi
          echo 'source branch is dev'
