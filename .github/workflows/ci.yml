name: CI

on:
  push:
    branches:
      - 'main'
      - 'master'
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: [Hermes Desktop Light]
    types: [completed]

permissions:
  contents: read
jobs:
  resolve-target:
    name: Resolve validation commit
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        name: Resolve exact written-back commit
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          target="$GITHUB_SHA"
          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${WORKFLOW_RUN_ID}/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name == "hermes-desktop-light-written-back-sha" and .expired == false)][0].id // empty')"
            if [[ -n "$artifact_id" ]]; then
              scratch="$(mktemp -d)"
              gh run download "$WORKFLOW_RUN_ID" --repo "$GITHUB_REPOSITORY" \
                --name hermes-desktop-light-written-back-sha --dir "$scratch"
              target="$(tr -d '\r\n' < "$scratch/written-back-sha.txt")"
            else
              target="$WORKFLOW_RUN_HEAD_SHA"
            fi
          fi
          if [[ ! "$target" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Resolved commit is not an exact lowercase 40-character SHA" >&2
            exit 1
          fi
          echo "sha=$target" >> "$GITHUB_OUTPUT"

  test:
    name: Test
    needs: resolve-target
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - name: Checkout Bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need at least 2 commits to properly gather changed files for linting
          fetch-depth: 2
          path: 'my_bucket'
          persist-credentials: false
          # workflow_run uses the exact publisher writeback SHA (or its triggering head SHA).
          ref: ${{ needs.resolve-target.outputs.sha }}
      - name: Checkout Scoop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ScoopInstaller/Scoop
          ref: e6aa3b366bdee8ed138c1e0f7b85192ebdd35d0f # pinned for distribution-versions.ps1
          path: 'scoop_core'
      - name: Run distribution-name guard
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s .\my_bucket\tests -p test_distribution.py -v
      - name: Install and cache test dependencies
        uses: potatoqualitee/psmodulecache@9e4b63833c22c1768d648e115a9c849afdda22a5 # v6.3
        with:
          modules-to-cache: BuildHelpers, Pester
          shell: ${{ matrix.shell }}
      - name: Run tests
        run: |
          $env:SCOOP_HOME="$(Convert-Path '.\scoop_core')"
          .\my_bucket\tests\distribution-versions.ps1 -ScoopHome $env:SCOOP_HOME
          .\my_bucket\bin\test.ps1
