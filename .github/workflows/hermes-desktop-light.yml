name: Hermes Desktop Light

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Build channel (development follows pinned upstream main; stable requires a Light stable release)'
        type: choice
        options: [development, stable]
        default: development
        required: true
      revision:
        description: 'Distribution revision (r1 initially; r2+ only for an approved same-commit rebuild)'
        type: string
        default: '1'
  pull_request:
    paths:
      - '.github/workflows/hermes-desktop-light.yml'
      - 'scripts/*hermes-desktop-light*'
      - 'scripts/distribution.py'
      - 'tests/test_distribution.py'
      - 'tests/test_hermes_desktop_light*.py'

permissions:
  contents: read

concurrency:
  group: hermes-desktop-light-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.plan.outputs.build }}
      channel: ${{ steps.plan.outputs.channel }}
      ref: ${{ steps.plan.outputs.ref }}
      version: ${{ steps.plan.outputs.version }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      artifact: ${{ steps.plan.outputs.artifact }}
      short_sha: ${{ steps.plan.outputs.short_sha }}
      license_sha: ${{ steps.plan.outputs.license_sha }}
      conditions_fingerprint: ${{ steps.plan.outputs.conditions_fingerprint }}
      claim: ${{ steps.plan.outputs.claim }}
      claim_object: ${{ steps.plan.outputs.claim_object }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_hermes_desktop_light*.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_distribution.py' -v
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.channel || 'development' }}
          BUILD_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || '1' }}
          REVISION_EXPLICIT: ${{ github.event_name == 'workflow_dispatch' }}
          DEV_RELEASE_ENABLED: ${{ vars.HERMES_DESKTOP_LIGHT_DEV_RELEASE_ENABLED }}
          STABLE_RELEASE_ENABLED: ${{ vars.HERMES_DESKTOP_LIGHT_RELEASE_ENABLED }}
        run: python3 scripts/hermes-desktop-light.py plan

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      RELEASE_CLAIM_TAG: ${{ needs.plan.outputs.claim }}
      RELEASE_CLAIM_OBJECT: ${{ needs.plan.outputs.claim_object }}
      CONDITIONS_FINGERPRINT: ${{ needs.plan.outputs.conditions_fingerprint }}
      LICENSE_SHA256: ${{ needs.plan.outputs.license_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: bucket
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Build and smoke-test remote-only unpacked application
        shell: pwsh
        env:
          CHANNEL: ${{ needs.plan.outputs.channel }}
          SOURCE_REF: ${{ needs.plan.outputs.ref }}
          PACKAGE_VERSION: ${{ needs.plan.outputs.version }}
        run: ./bucket/scripts/build-hermes-desktop-light.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hermes-desktop-light-windows-x64
          path: output/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [plan, build]
    if: >-
      needs.plan.outputs.build == 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      ((needs.plan.outputs.channel == 'development' && vars.HERMES_DESKTOP_LIGHT_DEV_RELEASE_ENABLED == 'true') ||
       (needs.plan.outputs.channel == 'stable' && vars.HERMES_DESKTOP_LIGHT_RELEASE_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Download this run's verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name hermes-desktop-light-windows-x64 --dir output
      - name: Publish immutable release and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          RELEASE_ENABLED: ${{ needs.plan.outputs.channel == 'development' && vars.HERMES_DESKTOP_LIGHT_DEV_RELEASE_ENABLED || vars.HERMES_DESKTOP_LIGHT_RELEASE_ENABLED }}
          PACKAGE_VERSION: ${{ needs.plan.outputs.version }}
          SOURCE_REF: ${{ needs.plan.outputs.ref }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          CONDITIONS_FINGERPRINT: ${{ needs.plan.outputs.conditions_fingerprint }}
          LICENSE_SHA256: ${{ needs.plan.outputs.license_sha }}
        run: python3 scripts/hermes-desktop-light.py publish
