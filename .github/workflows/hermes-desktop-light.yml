name: Hermes Desktop Light

on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:
    inputs:
      revision:
        description: 'Distribution revision (r1 for a new Desktop release; r2+ only for an approved same-release fix)'
        type: string
        default: '1'
        required: true
  pull_request:
    paths:
      - '.github/workflows/hermes-desktop-light.yml'
      - 'scripts/*hermes-desktop-light*'
      - 'scripts/build-hermes-desktop-light.ps1'
      - 'scripts/distribution.py'
      - 'tests/test_distribution.py'
      - 'tests/test_hermes_desktop_light*.py'
      - 'tests/accept-hermes-desktop-light*'

permissions:
  contents: read

concurrency:
  group: hermes-desktop-light-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      build: ${{ steps.plan.outputs.build }}
      channel: ${{ steps.plan.outputs.channel }}
      status: ${{ steps.plan.outputs.status }}
      skip_reason: ${{ steps.plan.outputs.skip_reason }}
      ref: ${{ steps.plan.outputs.ref }}
      upstream_tag: ${{ steps.plan.outputs.upstream_tag }}
      version: ${{ steps.plan.outputs.version }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      artifact: ${{ steps.plan.outputs.artifact }}
      short_sha: ${{ steps.plan.outputs.short_sha }}
      license_sha: ${{ steps.plan.outputs.license_sha }}
      conditions_fingerprint: ${{ steps.plan.outputs.conditions_fingerprint }}
      desktop_version: ${{ steps.plan.outputs.desktop_version }}
      desktop_feed_url: ${{ steps.plan.outputs.desktop_feed_url }}
      desktop_feed_etag: ${{ steps.plan.outputs.desktop_feed_etag }}
      desktop_feed_last_modified: ${{ steps.plan.outputs.desktop_feed_last_modified }}
      desktop_artifact_url: ${{ steps.plan.outputs.desktop_artifact_url }}
      desktop_artifact_sha256: ${{ steps.plan.outputs.desktop_artifact_sha256 }}
      desktop_handoff_url: ${{ steps.plan.outputs.desktop_handoff_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_hermes_desktop_light*.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_distribution.py' -v
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_REVISION: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || '1' }}
          REVISION_EXPLICIT: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 scripts/hermes-desktop-light.py plan
      - name: Record unsupported-source reason
        if: steps.plan.outputs.status == 'unsupported'
        run: |
          {
            echo '## Official Desktop release skipped';
            echo;
            echo "Reason: \\`${{ steps.plan.outputs.skip_reason }}\\`";
            echo 'The current installable manifest was not changed.';
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      CONDITIONS_FINGERPRINT: ${{ needs.plan.outputs.conditions_fingerprint }}
      LICENSE_SHA256: ${{ needs.plan.outputs.license_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: bucket
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Build and smoke-test pinned Desktop release source
        shell: pwsh
        env:
          SOURCE_REF: ${{ needs.plan.outputs.ref }}
          UPSTREAM_TAG: ${{ needs.plan.outputs.upstream_tag }}
          PACKAGE_VERSION: ${{ needs.plan.outputs.version }}
          DESKTOP_VERSION: ${{ needs.plan.outputs.desktop_version }}
          DESKTOP_FEED_URL: ${{ needs.plan.outputs.desktop_feed_url }}
          DESKTOP_FEED_ETAG: ${{ needs.plan.outputs.desktop_feed_etag }}
          DESKTOP_FEED_LAST_MODIFIED: ${{ needs.plan.outputs.desktop_feed_last_modified }}
          DESKTOP_ARTIFACT_URL: ${{ needs.plan.outputs.desktop_artifact_url }}
          DESKTOP_ARTIFACT_SHA256: ${{ needs.plan.outputs.desktop_artifact_sha256 }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ./bucket/scripts/build-hermes-desktop-light.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hermes-desktop-light-windows-x64
          path: output/*
          if-no-files-found: error
          retention-days: 14

  acceptance:
    needs: [plan, build]
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: bucket
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ needs.plan.outputs.ref }}
          fetch-depth: 0
          path: upstream
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: hermes-desktop-light-windows-x64
          path: artifact
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - name: Install the exact-release Hermes gateway (no provider extras)
        shell: pwsh
        working-directory: upstream
        run: python -m pip install --disable-pip-version-check --no-input -e '.[web]'
      - name: Run Scoop and remote-gateway acceptance
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ needs.plan.outputs.version }}
          SOURCE_REF: ${{ needs.plan.outputs.ref }}
        run: >-
          ./bucket/scripts/accept-hermes-desktop-light.ps1
          -ArtifactDirectory artifact
          -UpstreamDirectory upstream
          -PackageVersion "$env:PACKAGE_VERSION"
          -SourceRef "$env:SOURCE_REF"
          -OutputDirectory acceptance-output
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: hermes-desktop-light-windows-acceptance
          path: acceptance-output/*
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: [plan, build, acceptance]
    if: >-
      needs.plan.outputs.build == 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      vars.HERMES_DESKTOP_LIGHT_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Download this run's verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name hermes-desktop-light-windows-x64 --dir output
      - name: Download this run's passed Windows acceptance evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name hermes-desktop-light-windows-acceptance --dir acceptance
      - name: Publish immutable unofficial Light release and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENABLED: ${{ vars.HERMES_DESKTOP_LIGHT_RELEASE_ENABLED }}
          PACKAGE_VERSION: ${{ needs.plan.outputs.version }}
          SOURCE_REF: ${{ needs.plan.outputs.ref }}
          UPSTREAM_TAG: ${{ needs.plan.outputs.upstream_tag }}
          DESKTOP_VERSION: ${{ needs.plan.outputs.desktop_version }}
          DESKTOP_FEED_URL: ${{ needs.plan.outputs.desktop_feed_url }}
          CONDITIONS_FINGERPRINT: ${{ needs.plan.outputs.conditions_fingerprint }}
          LICENSE_SHA256: ${{ needs.plan.outputs.license_sha }}
          ACCEPTANCE_EVIDENCE: acceptance/acceptance.json
        run: python3 scripts/hermes-desktop-light.py publish
