name: Hermes Desktop Light

# The bucket ships one package per official Desktop channel, so every trigger
# runs the same release train once per channel.  `hermes-desktop-light` tracks
# stable and `hermes-desktop-light-canary` tracks canary; the two releases,
# manifests and pointers are independent.
on:
  schedule:
    - cron: '23 */4 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Official Desktop channel to release'
        type: choice
        options:
          - both
          - stable
          - canary
        default: both
        required: true
      revision:
        description: 'Distribution revision (r1 for a new Desktop release; r2+ only for an approved same-release fix)'
        type: string
        default: '1'
        required: true
  pull_request:
    paths:
      - '.github/workflows/hermes-desktop-light.yml'
      - '.github/workflows/hermes-desktop-light-release.yml'
      - 'scripts/*hermes-desktop-light*'
      - 'scripts/build-hermes-desktop-light.ps1'
      - 'scripts/distribution.py'
      - 'tests/test_distribution.py'
      - 'tests/test_hermes_desktop_light*.py'
      - 'tests/accept-hermes-desktop-light*'

permissions:
  contents: write
  actions: read

jobs:
  stable:
    if: github.event_name != 'workflow_dispatch' || inputs.channel != 'canary'
    uses: ./.github/workflows/hermes-desktop-light-release.yml
    with:
      channel: stable
      revision: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || '1' }}

  canary:
    if: github.event_name != 'workflow_dispatch' || inputs.channel != 'stable'
    uses: ./.github/workflows/hermes-desktop-light-release.yml
    with:
      channel: canary
      revision: ${{ github.event_name == 'workflow_dispatch' && inputs.revision || '1' }}
